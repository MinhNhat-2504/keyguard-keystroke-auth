# Local development only. The password below is a disposable test fixture.
name: keyguard-storage-local
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keyguard_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: keyguard-local-test-only
    ports:
      - "127.0.0.1::5432"
    volumes:
      - pg-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keyguard_local"]
      interval: 2s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: Dockerfile.storage
    environment:
      KEYGUARD_STORAGE: postgres
      DATABASE_URL: postgresql://postgres:keyguard-local-test-only@db:5432/keyguard_local
    ports:
      - "127.0.0.1::8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pg-local:
