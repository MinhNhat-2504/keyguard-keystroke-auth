<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyGuard - Thu thập dữ liệu nhịp gõ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h2>KeyGuard Data Collector</h2>
   
    <div class="info-card">
        Mã định danh của bạn: <span id="pid" style="color: var(--primary-color);">Đang tải...</span>
        <br><br>
        <button id="changeUserBtn">Đổi sang người test mới</button>
    </div>

    <div class="info-card">
        <label for="sessionSelect"><b>Chọn phiên gõ (Session):</b></label>
        <select id="sessionSelect">
            <option value="1">Phiên 1 (Ngày 1)</option>
            <option value="2">Phiên 2 (Ngày 2)</option>
            <option value="3">Phiên 3 (Ngày 3)</option>
        </select>
    </div>
   
    <p>Hãy gõ chính xác câu mẫu bên dưới rồi nhấn <b>Enter</b>:</p>
    <div class="target-box">.tie5Roanl</div>
   
    <input type="text" id="targetInput" placeholder="Bấm vào đây và bắt đầu gõ..." autofocus autocomplete="off">
   
    <div class="status" id="statusMsg"></div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
