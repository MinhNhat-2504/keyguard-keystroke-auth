<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyGuard - Đăng ký tài khoản nhịp gõ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
</head>
<body>
<div class="card">
    <h2>KeyGuard - Đăng ký mẫu nhịp gõ</h2>
   
    <div id="setupStep">
        <label>Nhập tên tài khoản muốn đăng ký:</label>
        <input type="text" id="regUsername" placeholder="Ví dụ: Thư Nguyễn">
        <button onclick="startEnroll()">Bắt đầu ghi nhận mẫu</button>
    </div>
    
    <div id="typingStep" class="hidden">
        <p style="text-align: center; font-weight: 600; color: var(--primary-color);">Tiến độ: Lần <span id="currentAttempt">1</span> / 5</p>
        <p>Gõ chính xác chuỗi:</p>
        <div class="target-text">.tie5Roanl</div>
        <input type="text" id="regInput" placeholder="Gõ xong khớp chuỗi tự động..." autocomplete="off">
        <div class="status" id="regStatus"></div>
    </div>
    
    <div class="link">
        <a href="/">Đã có tài khoản? Quay lại đăng nhập</a>
    </div>
</div>
<script>
    const TARGET_STRING = ".tie5Roanl";
    const TOTAL_ENROLL_ATTEMPTS = 5;
    let regUsername = "";
    let currentAttempt = 1;
    let allEnrollEvents = [];
   
    let currentKeyEvents = [];
    let keyPressedTime = {};

    function startEnroll() {
        regUsername = document.getElementById('regUsername').value.trim();
        if (!regUsername) {
            alert("Vui lòng nhập tên tài khoản!");
            return;
        }
        document.getElementById('setupStep').classList.add('hidden');
        document.getElementById('typingStep').classList.remove('hidden');
        document.getElementById('regInput').focus();
        initEnrollListeners();
    }

    function initEnrollListeners() {
        const input = document.getElementById('regInput');
        input.addEventListener('keydown', (e) => {
            const time = performance.now();
            if (!keyPressedTime[e.key]) keyPressedTime[e.key] = time;
        });

        input.addEventListener('keyup', (e) => {
            const time = performance.now();
            currentKeyEvents.push({
                key: e.key,
                down_time: keyPressedTime[e.key] || time,
                up_time: time,
                hold_time: time - (keyPressedTime[e.key] || time)
            });
            delete keyPressedTime[e.key];
        });

        input.addEventListener('input', async (e) => {
            if (input.value === TARGET_STRING) {
                allEnrollEvents.push({
                    attempt_index: currentAttempt,
                    events: [...currentKeyEvents]
                });
                input.value = "";
                currentKeyEvents = [];
                keyPressedTime = {};
               
                currentAttempt++;
                if (currentAttempt > TOTAL_ENROLL_ATTEMPTS) {
                    document.getElementById('typingStep').innerHTML = "<h3 style='color: var(--primary-color); text-align: center;'>⏳ Đang xử lý đăng ký...</h3>";
                   
                    const response = await fetch('/api/enroll', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: regUsername, events: allEnrollEvents })
                    });
                    const res = await response.json();
                   
                    document.getElementById('typingStep').innerHTML = `<h3 style='color: #2f855a; text-align: center;'>🎉 Hoàn tất!</h3><p style='text-align: center;'>${res.message}</p><div class='link'><a href='/'>Quay lại trang Đăng nhập</a></div>`;
                } else {
                    document.getElementById('currentAttempt').innerText = currentAttempt;
                    document.getElementById('regStatus').innerText = "Thành công! Tiếp tục lần tiếp theo.";
                    setTimeout(() => { document.getElementById('regStatus').innerText = ""; }, 1000);
                }
            }
        });
    }
</script>
</body>
</html>
